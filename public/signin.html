<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · MyDay</title>
<meta name="description" content="Sign in to MyDay to keep your tasks on all your devices.">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  @font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/instrument-sans-latin.woff2) format("woff2")}
  :root{--f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--bg:#F6F7F9;--surface:#FFFFFF;--subtle:#EEF1F6;--text:#13204A;--muted:#6B7389;--subtle-text:#9AA1B2;--line:#E4E7EE;--accent:#2E5BFF;--on-accent:#FFFFFF;--danger:#E5484D;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root{--bg:#0B1020;--surface:#131A2E;--subtle:#1A2238;--text:#E9ECF5;--muted:#8A93AB;--subtle-text:#5D6680;--line:#222B44;--accent:#7B95FF;--on-accent:#0B1020;--danger:#FF7A7D}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:400 15px/22px "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:400px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
  h1{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.02em;margin:24px 0 8px}
  p{margin:8px 0}
  .muted{color:var(--muted)}
  a{color:var(--accent);text-decoration:none}
  form{display:grid;gap:16px;margin:24px 0 12px}
  label{display:grid;gap:8px;font:500 13px/16px var(--f);color:var(--muted)}
  input{font:400 17px/24px var(--f);letter-spacing:-.005em;color:var(--text);background:var(--subtle);border:2px solid transparent;border-radius:12px;padding:0 14px;height:48px;width:100%}
  input::placeholder{color:var(--subtle-text)}
  input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  button{font:500 15px/20px var(--f);height:40px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);cursor:pointer;padding:0 18px;margin-top:4px}
  button:disabled{opacity:.5;cursor:default}
  button.secondary{background:var(--subtle);color:var(--text);margin:0}
  .alt{display:grid;gap:8px;margin:28px 0 8px}
  .alt p{margin:0;text-align:center;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:4px 20px}
  .links a{padding:10px 0;font-weight:500}
  #msg{min-height:22px}
  #msg.error{color:var(--danger)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p><a href="/">← Back to MyDay</a></p>
  <h1 id="title">Sign in</h1>
  <p class="muted" id="intro">Sign in to keep your tasks on your phone, iPad and Mac.</p>

  <form id="form" novalidate>
    <label id="emailField">Email
      <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
    </label>
    <label id="passwordField">Password
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    </label>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>

  <div class="links">
    <a href="#" data-mode="forgot">Forgot password?</a>
    <a href="#" data-mode="signin">Back to sign in</a>
  </div>
  <div class="alt" id="alt">
    <p id="altText"></p>
    <button class="secondary" id="altButton" type="button"></button>
  </div>
  <p class="muted" style="margin-top:32px"><a href="/privacy">Privacy</a></p>
</main>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const resetToken = params.get("token");

  const MODES = {
    signin: {title:"Sign in", intro:"Sign in to keep your tasks on your phone, iPad and Mac.", button:"Sign in", email:true, password:"current-password", links:["forgot"], alt:["New to MyDay?", "Create an account", "signup"]},
    signup: {title:"Create an account", intro:"Use your email and a password of at least 8 characters. We'll send you a link to confirm your email.", button:"Create account", email:true, password:"new-password", links:[], alt:["Already have an account?", "Sign in", "signin"]},
    forgot: {title:"Forgot password", intro:"Enter your email and we'll send you a link to choose a new password.", button:"Send reset link", email:true, password:null, links:["signin"]},
    reset:  {title:"Choose a new password", intro:"At least 8 characters.", button:"Save new password", email:false, password:"new-password", links:[]},
  };
  let mode;

  function show(m, message, isError){
    mode = m;
    const c = MODES[m];
    $("title").textContent = c.title;
    $("intro").textContent = c.intro;
    $("submit").textContent = c.button;
    $("emailField").hidden = !c.email;
    $("passwordField").hidden = !c.password;
    if (c.password) $("password").autocomplete = c.password;
    document.querySelectorAll("[data-mode]").forEach(a=>{ a.hidden = !c.links.includes(a.dataset.mode); });
    $("alt").hidden = !c.alt;
    if (c.alt){ $("altText").textContent = c.alt[0]; $("altButton").textContent = c.alt[1]; $("altButton").dataset.to = c.alt[2]; }
    say(message || "", isError);
  }
  function say(text, isError){ $("msg").textContent = text; $("msg").className = isError ? "error" : ""; }

  async function post(path, body){
    const r = await fetch("/api/auth/"+path, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
    const d = await r.json().catch(()=>({}));
    if (!r.ok){ const e = new Error(d.message || "HTTP "+r.status); e.code = d.code; e.status = r.status; throw e; }
    return d;
  }

  function friendly(e){
    if (!navigator.onLine) return "You're offline. Try again when you're back online.";
    switch (e.code){
      case "INVALID_EMAIL_OR_PASSWORD": return "That email and password don't match.";
      case "INVALID_EMAIL": return "Please check the email address.";
      case "PASSWORD_TOO_SHORT": return "Please use at least 8 characters.";
      case "PASSWORD_TOO_LONG": return "Please use at most 128 characters.";
      case "EMAIL_NOT_VERIFIED": return "Please confirm your email first. We've sent you a new link.";
      case "INVALID_TOKEN": return "That link has expired or was already used. Ask for a new one below.";
    }
    if (e.status===429) return "Too many tries. Please wait a minute and try again.";
    return "Something went wrong ("+e.message+"). Please try again.";
  }

  $("form").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const email = $("email").value.trim(), password = $("password").value;
    if (MODES[mode].email && !email) return say("Please enter your email.", true);
    if (MODES[mode].password && !password) return say("Please enter a password.", true);
    $("submit").disabled = true;
    say("");
    try {
      if (mode==="signin"){
        await post("sign-in/email", {email, password, callbackURL:"/signin?mode=verified"});
        location.replace("/");
        return;
      }
      if (mode==="signup"){
        await post("sign-up/email", {email, password, name:"", callbackURL:"/signin?mode=verified"});
        $("password").value = "";
        show("signin", "Check your email. We've sent a link to "+email+". Open it to finish creating your account.");
      } else if (mode==="forgot"){
        await post("request-password-reset", {email, redirectTo:"/signin?mode=reset"});
        show("signin", "If there's a MyDay account for "+email+", we've sent it a link to choose a new password.");
      } else if (mode==="reset"){
        await post("reset-password", {newPassword:password, token:resetToken});
        $("password").value = "";
        history.replaceState(null, "", "/signin");
        show("signin", "Your new password is saved. You can sign in now.");
      }
    } catch(e){
      say(friendly(e), true);
      if (e.code==="INVALID_TOKEN") show("forgot", friendly(e), true);
    }
    $("submit").disabled = false;
  });

  function go(m){ show(m); $(MODES[m].email ? "email" : "password").focus(); }
  document.querySelectorAll("[data-mode]").forEach(a=>a.addEventListener("click", ev=>{ ev.preventDefault(); go(a.dataset.mode); }));
  $("altButton").addEventListener("click", ()=>go($("altButton").dataset.to));

  // arriving from a link in an email
  const m = params.get("mode"), error = params.get("error");
  if (m==="verified" && !error){ location.replace("/"); return; } // email confirmed and signed in
  if (m==="verified") show("signin", "That confirmation link has expired or was already used. Sign in and we'll send you a new one.", true);
  else if (m==="reset" && error) show("forgot", friendly({code:"INVALID_TOKEN"}), true);
  else if (m==="reset" && resetToken) show("reset");
  else show(m==="signup" ? "signup" : "signin");
})();
</script>
</body>
</html>
