<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · MyDay</title>
<meta name="description" content="Sign in to MyDay to keep your tasks on all your devices.">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>try { var t = localStorage.getItem("dp:theme"); if (t==="light"||t==="dark") document.documentElement.dataset.theme = t; } catch(e){}</script>
<style>
  @font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/instrument-sans-latin.woff2) format("woff2")}
  :root{--f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--bg:#F6F7F9;--surface:#FFFFFF;--subtle:#EEF1F6;--text:#13204A;--muted:#6B7389;--subtle-text:#9AA1B2;--line:#E4E7EE;--accent:#2E5BFF;--on-accent:#FFFFFF;--danger:#E5484D;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1020;--surface:#131A2E;--subtle:#1A2238;--text:#E9ECF5;--muted:#8A93AB;--subtle-text:#5D6680;--line:#222B44;--accent:#7B95FF;--on-accent:#0B1020;--danger:#FF7A7D}}
  :root[data-theme=dark]{--bg:#0B1020;--surface:#131A2E;--subtle:#1A2238;--text:#E9ECF5;--muted:#8A93AB;--subtle-text:#5D6680;--line:#222B44;--accent:#7B95FF;--on-accent:#0B1020;--danger:#FF7A7D}
  :root[data-theme=light]{color-scheme:light} :root[data-theme=dark]{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:400 15px/22px var(--f);-webkit-font-smoothing:antialiased}
  main{max-width:400px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
  h1{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.02em;margin:24px 0 8px}
  p{margin:8px 0}
  .muted{color:var(--muted)}
  .muted b{font-weight:500;color:var(--text)}
  a{color:var(--accent);text-decoration:none}
  form{display:grid;gap:16px;margin:24px 0 8px}
  label{display:grid;gap:8px;font:500 13px/16px var(--f);color:var(--muted)}
  input{font:400 17px/24px var(--f);letter-spacing:-.005em;color:var(--text);background:var(--subtle);border:2px solid transparent;border-radius:12px;padding:0 14px;height:48px;width:100%}
  input::placeholder{color:var(--subtle-text)}
  input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  input.code{font:600 22px/28px var(--f);letter-spacing:.3em}
  input.code::placeholder{letter-spacing:.3em}
  button{font:500 15px/20px var(--f);height:40px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);cursor:pointer;padding:0 18px;margin-top:4px;width:100%}
  button:disabled{opacity:.5;cursor:default}
  button.quiet{background:transparent;color:var(--accent);margin:0}
  button.quiet:disabled{color:var(--muted)}
  button.link{background:none;color:var(--muted);height:auto;padding:10px 0;margin:0;font:400 13px/18px var(--f)}
  .acts{display:grid;gap:4px}
  .hint{font:400 13px/18px var(--f);color:var(--muted);margin:-8px 0 0}
  .msg{font:400 13px/18px var(--f);margin:-8px 0 0}
  .msg.error{color:var(--danger)}
  .foot{margin-top:32px;font:400 12px/16px var(--f);color:var(--muted)}
  .foot .kk{opacity:.7;font-weight:500}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p><a href="/">← Back to MyDay</a></p>

  <section id="emailStep">
    <h1>Sign in to MyDay</h1>
    <p class="muted">Enter your email and we'll send you a 6-digit code. New here? This creates your account.</p>
    <form id="emailForm" novalidate>
      <label>Email
        <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com">
      </label>
      <p class="msg" id="emailMsg" role="status" aria-live="polite" hidden></p>
      <button id="sendBtn" type="submit">Send code</button>
    </form>
  </section>

  <section id="codeStep" hidden>
    <h1>Check your email</h1>
    <p class="muted">We sent a 6-digit code to <b id="sentTo"></b>. It works for 10 minutes.</p>
    <form id="codeForm" novalidate>
      <label>Code
        <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456">
      </label>
      <p class="msg" id="codeMsg" role="status" aria-live="polite" hidden></p>
      <p class="hint">Check your spam folder</p>
      <div class="acts">
        <button id="signInBtn" type="submit">Sign in</button>
        <button id="resendBtn" class="quiet" type="button">Send a new code</button>
        <button id="otherBtn" class="link" type="button">Use a different email</button>
      </div>
    </form>
  </section>

  <p class="foot"><a href="/privacy">Privacy</a> · <span class="kk">{ kasah kod }</span></p>
</main>
<script>
(function(){
  "use strict";
  // Rules from worker/limits.js
  const CODE_MINUTES = 10, RESEND_WAIT_MS = 60 * 1000;
  const KEY = "dp:sign-in"; // {email, waitUntil}: a code was sent, so switching to the mail app and back keeps this step
  const $ = id => document.getElementById(id);
  let pending = null, busy = false, verifying = false;

  function load(){
    try {
      const p = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!p || typeof p.email!=="string" || typeof p.waitUntil!=="number") return null;
      return Date.now() - (p.waitUntil - RESEND_WAIT_MS) < CODE_MINUTES * 60000 ? p : null; // not if that code has expired
    } catch(e){ return null; }
  }
  function save(p){ try { if (p) localStorage.setItem(KEY, JSON.stringify(p)); else localStorage.removeItem(KEY); } catch(e){} }
  function lastEmail(){ try { const p = JSON.parse(localStorage.getItem(KEY) || "null"); return p && p.email || ""; } catch(e){ return ""; } }

  // the message under the field of the step on screen
  function say(text, isError){
    ["emailMsg","codeMsg"].forEach(id=>{ $(id).textContent = ""; $(id).hidden = true; });
    const m = $(pending ? "codeMsg" : "emailMsg");
    m.textContent = text || ""; m.className = "msg"+(isError ? " error" : ""); m.hidden = !text;
  }
  const clock = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const inWords = s => s < 90 ? s+" second"+(s===1?"":"s") : Math.ceil(s/60)+" minutes";

  async function post(path, body){
    let r;
    try { r = await fetch("/api/auth/"+path, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)}); }
    catch(e){ const err = new Error("network"); err.status = 0; throw err; }
    const d = await r.json().catch(()=>({}));
    if (!r.ok){
      const e = new Error(d.message || "HTTP "+r.status); e.code = d.code; e.status = r.status;
      e.retryAfter = Number(r.headers.get("retry-after")) || 0; throw e;
    }
    return d;
  }

  const NETWORK = "Couldn't connect. Check your internet and try again.";
  function sendError(e){
    if (e.status===0 || !navigator.onLine) return NETWORK;
    if (e.code==="TOO_SOON" && e.retryAfter) return "You can ask for a new code in "+inWords(e.retryAfter)+".";
    if (e.status===429) return "Too many requests. Please wait a minute and try again.";
    if (e.code==="INVALID_EMAIL") return "That email address doesn't look right.";
    return "Couldn't send the code. Please try again.";
  }
  function codeError(e){
    if (e.status===0 || !navigator.onLine) return NETWORK;
    if (e.code==="INVALID_OTP") return "That code isn't right. Check the email and try again.";
    if (e.code==="OTP_EXPIRED") return "That code has expired. Send a new code.";
    if (e.code==="TOO_MANY_ATTEMPTS") return "Too many wrong tries. Send a new code.";
    if (e.status===429) return "Too many tries. Please wait a minute and try again.";
    return "Couldn't sign you in. Please try again.";
  }

  function render(){
    $("emailStep").hidden = !!pending;
    $("codeStep").hidden = !pending;
    if (pending) $("sentTo").textContent = pending.email;
    $("sendBtn").disabled = busy; $("sendBtn").textContent = busy && !pending ? "Sending…" : "Send code";
    $("signInBtn").disabled = busy; $("signInBtn").textContent = busy && verifying ? "Signing in…" : "Sign in";
    $("otherBtn").disabled = busy;
    tick();
  }
  // the "Send a new code" countdown
  function tick(){
    if (!pending) return;
    const wait = Math.max(0, Math.ceil((pending.waitUntil - Date.now()) / 1000));
    $("resendBtn").disabled = busy || wait > 0;
    $("resendBtn").textContent = wait > 0 ? "Send a new code in "+clock(wait) : "Send a new code";
  }
  setInterval(tick, 1000);

  function remember(p){ save(p); pending = p; }

  async function send(to){
    const was = pending;
    busy = true; render();
    try {
      await post("email-otp/send-verification-otp", {email:to, type:"sign-in"});
      remember({email:to, waitUntil:Date.now() + RESEND_WAIT_MS});
      $("code").value = ""; say("");
    } catch(e){
      // a code was sent a moment ago: carry on to the code step (and say why no new code is
      // coming, unless it's just the usual one-minute wait from the email step)
      if (e.code==="TOO_SOON" && e.retryAfter){
        remember({email:to, waitUntil:Date.now() + e.retryAfter*1000});
        say(was || e.retryAfter*1000 > RESEND_WAIT_MS ? sendError(e) : "", true);
      } else say(sendError(e), true);
    }
    busy = false; render();
    if (pending) $("code").focus();
  }

  async function verify(value){
    if (!pending || verifying) return;
    if (!/^\d{6}$/.test(value)) return say("Enter the 6-digit code from the email.", true);
    verifying = true; busy = true; render(); say("");
    try {
      const d = await post("sign-in/email-otp", {email:pending.email, otp:value});
      save(null);
      // a brand-new account sees the intro cards next; anyone else goes straight to their tasks
      const created = Date.parse(d && d.user && d.user.createdAt);
      location.replace("/?from=" + (created > Date.now() - 10*60000 ? "new" : "signin"));
      return;
    } catch(e){ say(codeError(e), true); }
    verifying = false; busy = false; render();
  }

  $("emailForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const to = $("email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return say("Enter your email address, e.g. you@example.com.", true);
    send(to);
  });
  $("codeForm").addEventListener("submit", ev=>{ ev.preventDefault(); verify($("code").value); });
  $("code").addEventListener("input", ()=>{
    const digits = $("code").value.replace(/\D/g,"").slice(0,6);
    $("code").value = digits; say("");
    if (digits.length===6) verify(digits); // a full code (typed or filled in from the email) signs in straight away
  });
  $("resendBtn").addEventListener("click", ()=>{ if (pending) send(pending.email); });
  $("otherBtn").addEventListener("click", ()=>{ remember(null); $("code").value = ""; say(""); render(); $("email").focus(); });

  pending = load();
  $("email").value = lastEmail();
  render();
  if (!pending) $("email").focus();
})();
</script>
</body>
</html>
