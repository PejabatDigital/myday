<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="when">
      <div class="dow"><span id="dow">—</span><span class="tag" id="todayTag" hidden>Today</span></div>
      <h1 id="title">Opening your page…</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button id="vDay" aria-pressed="true">Day</button>
        <button id="vMonth" aria-pressed="false">Month</button>
      </div>
      <button class="btn icon" id="prev" aria-label="Previous day">‹</button>
      <button class="btn" id="today">Today</button>
      <button class="btn icon" id="next" aria-label="Next day">›</button>
      <span class="btn icon datepick" title="Pick a date">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <input type="date" id="pick" aria-label="Pick a date">
      </span>
      <button class="btn" id="notesBtn" aria-pressed="false" aria-label="Notes" title="Notes">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5V20a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M9 11h6M9 15h6"/></svg>
        <span class="lbl">Notes</span>
      </button>
    </div>
  </header>

  <nav class="week" id="week" aria-label="This week"></nav>

  <section class="month" id="month" hidden aria-label="Month">
    <div class="mhead"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="mgrid" id="mgrid"></div>
  </section>

  <div class="main" id="main">
    <section class="page" aria-label="To-do list">
      <div class="page-head"><span class="label" id="pageLabel">To do</span><span style="display:flex;gap:10px;align-items:center"><span class="counts" id="counts"></span><button class="btn" id="openDayBtn" hidden>Open page</button></span></div>
      <div id="carryIn"></div>
      <div id="listWrap"><div class="loading">Opening your page…</div></div>
      <div class="eod" id="eod" hidden></div>
    </section>
    <div class="scrim" id="scrim" hidden></div>
    <aside class="notes" id="notes" hidden aria-label="Notes">
      <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expand notes to full screen"><span></span></div>
      <div class="notes-hd" id="notesHd">
        <div class="seg nseg" role="group" aria-label="Which notes">
          <button id="ns-task" aria-pressed="false">Task</button>
          <button id="ns-day" aria-pressed="true">Day</button>
          <button id="ns-week" aria-pressed="false">Week</button>
        </div>
        <button class="a" id="closeNotes" aria-label="Close notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="nsub" id="nsub"></div>
      <div class="tb" id="tb" role="toolbar" aria-label="Formatting">
        <button data-cmd="bold" aria-pressed="false" aria-label="Bold" title="Bold (⌘B)"><b>B</b></button>
        <button data-cmd="italic" aria-pressed="false" aria-label="Italic" title="Italic (⌘I)"><i style="font-family:Georgia,serif">I</i></button>
        <button data-cmd="underline" aria-pressed="false" aria-label="Underline" title="Underline (⌘U)"><u>U</u></button>
        <button data-cmd="strikeThrough" aria-pressed="false" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
        <span class="sep"></span>
        <button data-cmd="h" class="h" aria-pressed="false" aria-label="Heading" title="Heading">H</button>
        <button data-cmd="ul" aria-pressed="false" aria-label="Bulleted list" title="Bulleted list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1.3" fill="currentColor" stroke="none"/><path d="M9.5 7H20M9.5 12H20M9.5 17H20"/></svg></button>
        <button data-cmd="insertOrderedList" aria-pressed="false" aria-label="Numbered list" title="Numbered list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 7H20M10 12H20M10 17H20"/><path d="M4.2 5.6l1.3-.8v4.4" stroke-width="1.4"/><path d="M3.9 14.4c.4-.6 2.3-.8 2.3.4 0 .9-2.3 2-2.3 3h2.5" stroke-width="1.4"/></svg></button>
        <button data-cmd="check" aria-pressed="false" aria-label="Checklist" title="Checklist (⇧⌘L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.3"/><path d="M4.5 7l1.2 1.2 2-2.2"/><rect x="3" y="14" width="6" height="6" rx="1.3"/><path d="M12 7h8M12 17h8"/></svg></button>
        <span class="sep"></span>
        <button data-cmd="link" aria-pressed="false" aria-label="Add link" title="Link (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
        <button data-cmd="clear" aria-label="Clear formatting" title="Clear formatting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 5h11M11.5 5l-3 14M4 20l16-16" /></svg></button>
      </div>
      <div class="linkbar" id="linkbar" hidden>
        <input id="linkIn" type="url" placeholder="Paste a link (https://…)" aria-label="Link address">
        <button class="btn pen" id="linkAdd">Add link</button>
        <button class="btn" id="linkCancel">Cancel</button>
      </div>
      <div class="openlink" id="openLink" hidden>
        <a id="openLinkA" href="#" target="_blank" rel="noopener noreferrer">Open link ↗</a>
        <button class="btn" id="unlink">Remove link</button>
      </div>
      <div class="ed" id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note" spellcheck="true"></div>
      <div class="nempty" id="nempty" hidden></div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="menu" id="menu" hidden role="menu"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
