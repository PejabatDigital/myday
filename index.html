<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyDay</title>
<meta name="description" content="A no-frills daily planner: today's tasks and notes together.">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyDay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<!-- Mac (wide windows): sidebar in place of the header icons and week strip -->
<aside class="side" id="side" aria-label="MyDay">
  <div class="brand"><span class="st"></span>MyDay</div>
  <nav class="nav" aria-label="Views">
    <button class="navi" id="navToday"><i class="ic ic-sun"></i><span>Today</span><span class="navc" id="navCount"></span></button>
    <button class="navi" id="navMonth"><i class="ic ic-calendar"></i><span>Month</span></button>
    <button class="navi" id="navWeek"><i class="ic ic-note"></i><span>Week note</span></button>
  </nav>
  <div class="mini" id="mini"></div>
  <div class="side-foot">
    <div class="sync" id="sideSync"></div>
    <div class="acct" id="sideAcct"></div>
  </div>
</aside>

<div class="wrap" id="wrap">
  <header class="top">
    <div class="when">
      <h1 id="title">Opening…</h1>
      <label class="sub" title="Pick a date"><span id="sub"></span><input type="date" id="pick" aria-label="Pick a date"></label>
    </div>
    <div class="controls">
      <button class="btn sec" id="today">Today</button>
      <button class="ib plain" id="prev" aria-label="Previous month"><i class="ic ic-left"></i></button>
      <button class="ib plain" id="next" aria-label="Next month"><i class="ic ic-right"></i></button>
      <button class="ib" id="vMonth" aria-pressed="false" aria-label="Month"><i class="ic ic-calendar"></i></button>
      <button class="ib" id="notesBtn" aria-pressed="false" aria-label="Notes"><i class="ic ic-note"></i></button>
    </div>
  </header>

  <div class="dayline" id="dayline"><div class="dl" id="dl"></div><div class="dls" id="counts"></div></div>

  <nav class="week" id="week" aria-label="This week"></nav>

  <section class="month" id="month" hidden aria-label="Month">
    <div class="mhead"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="mgrid" id="mgrid"></div>
  </section>

  <section class="page" id="main" aria-label="To-do list">
    <div class="addwrap" id="addWrap"></div>
    <div id="carryIn"></div>
    <div class="sh"><span id="pageLabel">Today</span><button class="btn quiet" id="openDayBtn" hidden>Open day</button></div>
    <div id="listWrap"><div class="loading">Opening your page…</div></div>
    <div class="eod" id="eod" hidden></div>
    <div class="foot">
      <div class="sync" id="foot"></div>
      <div class="acct" id="acct"></div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="notes" id="notes" hidden aria-label="Notes">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expand notes to full screen"><span></span></div>
  <div class="notes-hd" id="notesHd">
    <div class="seg nseg" role="group" aria-label="Which notes">
      <button id="ns-day" aria-pressed="true">Day</button>
      <button id="ns-task" aria-pressed="false">Task</button>
      <button id="ns-week" aria-pressed="false">Week</button>
    </div>
    <button class="btn quiet" id="closeNotes">Done</button>
  </div>
  <div class="nsub" id="nsub"></div>
  <div class="tb" id="tb" role="toolbar" aria-label="Formatting">
    <button data-cmd="bold" aria-pressed="false" aria-label="Bold" title="Bold (⌘B)"><b>B</b></button>
    <button data-cmd="h" class="h" aria-pressed="false" aria-label="Heading" title="Heading">H</button>
    <button data-cmd="ul" aria-pressed="false" aria-label="Bulleted list" title="Bulleted list"><i class="ic ic-list"></i></button>
    <button data-cmd="check" aria-pressed="false" aria-label="Checklist" title="Checklist (⇧⌘L)"><i class="ic ic-checklist"></i></button>
    <button data-cmd="link" aria-pressed="false" aria-label="Add link" title="Link (⌘K)"><i class="ic ic-link"></i></button>
    <button data-cmd="italic" aria-pressed="false" aria-label="Italic" title="Italic (⌘I)"><i class="it">I</i></button>
    <button data-cmd="underline" aria-pressed="false" aria-label="Underline" title="Underline (⌘U)"><u>U</u></button>
    <button data-cmd="strikeThrough" aria-pressed="false" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
    <button data-cmd="insertOrderedList" aria-pressed="false" aria-label="Numbered list" title="Numbered list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M10 7H20M10 12H20M10 17H20"/><path d="M4.2 5.6l1.3-.8v4.4" stroke-width="1.4"/><path d="M3.9 14.4c.4-.6 2.3-.8 2.3.4 0 .9-2.3 2-2.3 3h2.5" stroke-width="1.4"/></svg></button>
    <button data-cmd="clear" aria-label="Clear formatting" title="Clear formatting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 5h11M11.5 5l-3 14M4 20l16-16" /></svg></button>
  </div>
  <div class="linkbar" id="linkbar" hidden>
    <input id="linkIn" type="url" placeholder="Paste a link (https://…)" aria-label="Link address">
    <button class="btn primary" id="linkAdd">Add link</button>
    <button class="btn quiet" id="linkCancel">Cancel</button>
  </div>
  <div class="openlink" id="openLink" hidden>
    <a id="openLinkA" href="#" target="_blank" rel="noopener noreferrer">Open link ↗</a>
    <button class="btn quiet" id="unlink">Remove link</button>
  </div>
  <div class="ed" id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note" spellcheck="true"></div>
  <div class="nempty" id="nempty" hidden></div>
</aside>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="welcome" id="welcome" hidden></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
